name: Lint

on:
  push:
    branches: [main]
  pull_request:
      branches: [main]

jobs:
  lint:
    name: Run linter
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with: 
          node-version: '26.13.1'
          cache: 'npm'
      - name: install depencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint . 
      - name: Run Prettier check
        run: npx prettier --check .
